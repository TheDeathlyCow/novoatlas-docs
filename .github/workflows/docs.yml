name: Documentation
on:
  push:
    branches:
      - latest
      - "release/**"
permissions:
  contents: write
concurrency:
  group: docs-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical git+https://github.com/squidfunk/mike.git
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy
        env:
          LATEST_VERSION: "26.3"
        run: |
          if [ "$GITHUB_REF_NAME" = "latest" ]; then
            mike deploy --push --update-aliases "$LATEST_VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "${GITHUB_REF_NAME#release/}"
          fi